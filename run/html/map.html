<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%; margin: 0; padding: 0;
            background-color: << bg_color >>; color: << text_color >>;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #map { width: 100%; height: 100%; background: << bg_color >>; }
        .leaflet-container { background: << bg_color >>; }

        /* Glassy floating info panel */
        .info-panel {
            position: absolute;
            bottom: 20px; left: 16px;
            width: 320px;
            max-height: 55%;
            display: flex; flex-direction: column;
            background: << panel_bg >>;
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid << panel_border >>;
            padding: 16px 18px;
            border-radius: 16px;
            box-shadow: 0 12px 36px << shadow_color >>;
            z-index: 1000;
            display: none;
            resize: both;
            overflow: auto;
            min-width: 220px;
            min-height: 120px;
        }
        .panel-header {
            font-weight: 600; font-size: 15px; margin-bottom: 10px;
            border-bottom: 1px solid << card_border >>; padding-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .panel-content { overflow-y: auto; flex: 1; font-size: 13px; }
        .loader { text-align: center; padding: 20px; font-style: italic; opacity: 0.7; }
        .close-btn {
            cursor: pointer; opacity: 0.55; font-size: 15px; line-height: 1;
            width: 22px; height: 22px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: opacity .15s ease, background .15s ease;
        }
        .close-btn:hover { opacity: 1; background: << card_bg >>; }

        /* Flight Card Styles */
        .flight-card {
            background: << card_bg >>;
            border: 1px solid << card_border >>;
            border-left: 3px solid << line_color >>;
            margin-bottom: 8px;
            border-radius: 10px;
            padding: 10px 12px;
            transition: background .15s ease, transform .15s ease;
        }
        .flight-card:hover { background: << panel_bg >>; }
        .flight-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: 600; }
        .flight-sub { font-size: 11px; opacity: 0.7; margin-bottom: 5px; }
        .detail-kv { display: flex; flex-direction: column; margin-bottom: 4px; }
        .label { opacity: 0.55; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
        .expand-btn {
            text-align: center; font-size: 10px; opacity: 0.6; cursor: pointer; margin-top: 6px;
            background: << card_bg >>; padding: 4px; border-radius: 6px;
            transition: opacity .15s ease, background .15s ease;
        }
        .expand-btn:hover { opacity: 1; background: << panel_bg >>; }

        /* Custom scrollbars to match the glass aesthetic */
        .panel-content::-webkit-scrollbar { width: 8px; }
        .panel-content::-webkit-scrollbar-thumb { background: << card_border >>; border-radius: 8px; }
        .panel-content::-webkit-scrollbar-track { background: transparent; }

        /* Airport legend - bottom right, collapsible into a pull tab.
           Collapsing hides the panel via display:none (rather than animating width/opacity)
           so sizing is unambiguous and identical across every browser. Both the panel and the
           tab get the SAME explicit height always - no flex "stretch"/min-height inference,
           which Firefox and Chromium resolve differently once a sibling is display:none. */
        .legend-root {
            display: flex;
            align-items: flex-start;
            background: << panel_bg >>;
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid << panel_border >>;
            border-right: none;
            border-radius: 16px 0 0 16px;
            box-shadow: 0 12px 36px << shadow_color >>;
            overflow: hidden;
            color: << text_color >>;
            margin-right: 0 !important;
        }
        .leaflet-right .legend-root { margin-right: 0 !important; }
        .legend-panel {
            box-sizing: border-box;
            flex: 0 0 230px;
            width: 230px;
            height: 152px;
            padding: 14px 18px;
            font-size: 13px;
            line-height: 1.6;
            white-space: normal;
        }
        .legend-root.collapsed .legend-panel { display: none; }
        .legend-title { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .legend-row { display: flex; align-items: center; gap: 10px; white-space: nowrap; padding: 2px 0; }
        .legend-dot { width: 14px; height: 14px; border: 1px solid << card_border >>; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; }
        .legend-tab {
            box-sizing: border-box;
            flex: 0 0 42px;
            width: 42px;
            height: 152px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 13px;
            user-select: none;
            color: << muted_color >>;
            transition: color .15s ease, background .15s ease;
        }
        .legend-tab:hover { color: << text_color >>; background: << card_bg >>; }
        .legend-tab svg { width: 14px; height: 14px; transition: transform .28s ease; }
        .legend-root.collapsed .legend-tab svg { transform: rotate(180deg); }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* Theme the built-in Leaflet zoom control to match dark/light mode */
        .leaflet-control-zoom.leaflet-bar {
            border: 1px solid << panel_border >> !important;
            border-radius: 12px !important;
            overflow: hidden;
            box-shadow: 0 8px 24px << shadow_color >> !important;
        }
        .leaflet-control-zoom a {
            background: << panel_bg >> !important;
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            color: << text_color >> !important;
            border-bottom: 1px solid << panel_border >> !important;
        }
        .leaflet-control-zoom a:hover,
        .leaflet-control-zoom a:focus {
            background: << card_bg >> !important;
        }
        .leaflet-control-zoom a.leaflet-disabled {
            color: << muted_color >> !important;
            background: << panel_bg >> !important;
        }

        /* Glassy tooltip to match the airport node styling */
        .atlas-tooltip.leaflet-tooltip {
            background: << panel_bg >> !important;
            backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid << panel_border >> !important;
            border-radius: 8px !important;
            color: << text_color >> !important;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 9px;
            box-shadow: 0 6px 18px << shadow_color >> !important;
        }
        .atlas-tooltip.leaflet-tooltip::before { display: none; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="info" class="info-panel">
        <div class="panel-header">Flights <span class="close-btn" onclick="deselect()">×</span></div>
        <div id="title-loc" style="margin-bottom:10px; opacity:0.8;"></div>
        <div id="panel-content" class="panel-content">Select an airport...</div>
    </div>

    <script>
        // --- DATA ---
        const airportsData = << airports_json >>;
        const routeRequestUrl = << route_request_url_json >>;
        const airports = {}; // Lookup map
        const airportMarkers = {}; // Marker lookup

        // --- CONFIG ---
        // Destination-count bands: red, yellow, blue, then dark blue.
        const COLOR_LOW = '#ef5b4a';
        const COLOR_MED = '#f8c20b';
        const COLOR_HIGH = '#0784ed';
        const COLOR_TOP = '#0b4fa3';
        const LINE_COLOR = '<< line_color >>';
        const MARKER_BORDER = '<< marker_border >>';

        // --- MAP INIT ---
        const map = L.map('map', {
            preferCanvas: true,
            minZoom: 2
        }).setView([20, 0], 2);

        // Custom Panes for Z-Index ordering
        map.createPane('routesPane');
        map.getPane('routesPane').style.zIndex = 390;

        map.createPane('airportsPane');
        map.getPane('airportsPane').style.zIndex = 400;

        L.tileLayer('<< tile_url >>', {
            attribution: '<< attr >>',
            maxZoom: 19
        }).addTo(map);

        // Bottom-right, collapsible into a slim pull tab that stays docked to the edge.
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = () => {
            const container = L.DomUtil.create('div', 'legend-root');
            container.innerHTML = `
                <div class="legend-panel">
                    <span class="legend-title">Airport legend</span>
                    <div class="legend-row"><span class="legend-dot" style="background:${COLOR_TOP}"></span>&gt; 100 non-stop destinations</div>
                    <div class="legend-row"><span class="legend-dot" style="background:${COLOR_HIGH}"></span>&gt; 30 non-stop destinations</div>
                    <div class="legend-row"><span class="legend-dot" style="background:${COLOR_MED}"></span>&gt; 7 non-stop destinations</div>
                    <div class="legend-row"><span class="legend-dot" style="background:${COLOR_LOW}"></span>&lt; 7 non-stop destinations</div>
                </div>
                <div class="legend-tab" title="Toggle airport legend" aria-label="Toggle airport legend">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>`;
            container.querySelector('.legend-tab').addEventListener('click', () => {
                container.classList.toggle('collapsed');
            });
            L.DomEvent.disableClickPropagation(container);
            return container;
        };
        legend.addTo(map);

        // Layers
        const routeLayer = L.layerGroup().addTo(map);
        const airportLayer = L.layerGroup().addTo(map);

        // Render everything at whichever 360°-wide "world copies" the viewport currently covers.
        // Offsets are created lazily as the user pans, so the map scrolls horizontally without
        // limit while every airport stays populated (matches flightconnections.com's behaviour).
        const renderedOffsets = new Set();

        // State
        let selectedSource = null;
        let selectedSourceOffset = 0; // world-copy offset of the source marker actually clicked
        let selectedDest = null;
        let selectedDestOffset = 0; // world-copy offset of the destination marker actually clicked
        let currentRoutes = [];
        let deselectMarker = null;
        let deselectDestMarker = null;
        let _isDragging = false;
        let _dragTimer = null;
        let visibleFilter = null; // Set of visible IATA codes, or null to show all

        // Nearest multiple of 360 that places canonicalLon closest to the map centre.
        // Formula-based (not a fixed lookup) so it keeps working no matter how many
        // times the user has panned around the globe.
        function nearestOffset(canonicalLon) {
            const centerLon = map.getCenter().lng;
            return Math.round((centerLon - canonicalLon) / 360) * 360;
        }

        // --- Show/Hide helpers (airportMarkers[iata] is an offset -> marker map) ---
        function showAirport(iata) {
            Object.values(airportMarkers[iata] || {}).forEach(m => {
                if (!airportLayer.hasLayer(m)) airportLayer.addLayer(m);
            });
        }
        function hideAirport(iata) {
            Object.values(airportMarkers[iata] || {}).forEach(m => {
                if (airportLayer.hasLayer(m)) airportLayer.removeLayer(m);
            });
        }

        // --- RENDER AIRPORTS (lazily, per world-copy offset) ---
        airportsData.forEach(ap => { airports[ap.iata] = ap; });

        function createAirportsForOffset(offset) {
            if (renderedOffsets.has(offset)) return;
            renderedOffsets.add(offset);

            airportsData.forEach(ap => {
                let color = COLOR_LOW;
                if (ap.rank === 1) color = COLOR_MED;
                if (ap.rank === 2) color = COLOR_HIGH;
                if (ap.rank === 3) color = COLOR_TOP;

                const marker = L.circleMarker([ap.lat, ap.lon + offset], {
                    radius: 3 + (ap.rank * 1.15),
                    fillColor: color,
                    color: MARKER_BORDER,
                    weight: 0.6,
                    stroke: true,
                    fillOpacity: 0.75,
                    pane: 'airportsPane'
                });
                marker.bindTooltip(ap.iata + " - " + ap.city, { direction: 'top', offset: [0, -5], className: 'atlas-tooltip' });
                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    handleAirportClick(ap.iata, offset);
                });

                if (!airportMarkers[ap.iata]) airportMarkers[ap.iata] = {};
                airportMarkers[ap.iata][offset] = marker;

                if (!visibleFilter || visibleFilter.has(ap.iata)) airportLayer.addLayer(marker);
            });
        }

        // Make sure every world copy overlapping the current viewport (plus a one-world buffer
        // on each side) has its airport markers created, so panning never runs out of data.
        function ensureWorldCoverage() {
            const bounds = map.getBounds();
            const minOffset = Math.floor(bounds.getWest() / 360) * 360 - 360;
            const maxOffset = Math.ceil(bounds.getEast() / 360) * 360 + 360;
            for (let offset = minOffset; offset <= maxOffset; offset += 360) {
                createAirportsForOffset(offset);
            }
        }

        ensureWorldCoverage();
        map.on('move', ensureWorldCoverage);

        map.on('drag', () => {
            _isDragging = true;
            if (_dragTimer) { clearTimeout(_dragTimer); _dragTimer = null; }
        });
        map.on('dragend', () => {
            _dragTimer = setTimeout(() => { _isDragging = false; }, 200);
        });

        // Re-render routes on every pan/zoom so they stay centred on the current world copy.
        map.on('moveend', () => {
            if (selectedSource) renderMapState();
        });

        map.on('click', () => {
            if (_isDragging) return;
            deselect();
        });

        // --- INTERACTION ---
        function handleAirportClick(code, offset) {
            // Scenario 1: Nothing selected yet -> Select Source
            if (selectedSource === null) {
                selectSource(code, offset);
                return;
            }

            // Scenario 2: Clicking the Source airport
            if (selectedSource === code) {
                if (selectedDest !== null) {
                    // If we were looking at a specific route, go back to showing all connections
                    deslectDestOnly();
                } else {
                    // Otherwise deselect all
                    deselect();
                }
                return;
            }

            // Scenario 3: Clicking a different airport
            // Check if it is connected to the current source
            const isConnected = currentRoutes.some(r => r.dep === code || r.arr === code);

            if (isConnected) {
                if (selectedDest === code) {
                    deslectDestOnly();
                } else {
                    selectedDest = code;
                    selectedDestOffset = offset;
                    document.getElementById('info').style.display = 'flex';

                    // Add deselect marker on destination airport - anchored to the exact
                    // clicked instance, not whichever copy happens to be nearest the centre.
                    if (deselectDestMarker) map.removeLayer(deselectDestMarker);
                    const destAp = airports[code];
                    if (destAp) {
                        deselectDestMarker = L.marker([destAp.lat, destAp.lon + offset], {
                            icon: L.divIcon({
                                className: 'deselect-icon',
                                html: '<div style="background:rgba(30,30,30,0.85); color:white; border-radius:4px; width:16px; height:16px; text-align:center; line-height:14px; font-weight:bold; font-size:12px; border: 1px solid #555; cursor: pointer;">×</div>',
                                iconSize: [16, 16],
                                iconAnchor: [-10, 10]
                            })
                        }).addTo(map);
                        deselectDestMarker.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            deslectDestOnly();
                        });
                    }

                    renderMapState(); // Filter view to this pair
                }
            } else {
                // Not connected (or data not loaded), switch source
                selectSource(code, offset);
            }
        }

        function selectSource(code, offset) {
            selectedSource = code;
            const ap = airports[code];
            selectedSourceOffset = offset !== undefined ? offset : nearestOffset(ap ? ap.lon : 0);
            selectedDest = null;
            currentRoutes = []; // Clear previous data
            routeLayer.clearLayers();

            // Remove old dest marker if any
            if (deselectDestMarker) {
                map.removeLayer(deselectDestMarker);
                deselectDestMarker = null;
            }

            // Add Deselect Marker on source - anchored to the exact clicked instance.
            if (deselectMarker) map.removeLayer(deselectMarker);
            if (ap) {
                deselectMarker = L.marker([ap.lat, ap.lon + selectedSourceOffset], {
                    icon: L.divIcon({
                        className: 'deselect-icon',
                        html: '<div style="background:rgba(30,30,30,0.85); color:white; border-radius:4px; width:16px; height:16px; text-align:center; line-height:14px; font-weight:bold; font-size:12px; border: 1px solid #555; cursor: pointer;">×</div>',
                        iconSize: [16, 16],
                        iconAnchor: [-10, 10] // Top-right offset
                    })
                }).addTo(map);

                deselectMarker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    if (selectedDest !== null) {
                        // Pan to the exact world copy of the dest airport that was clicked,
                        // so the promoted-source view stays anchored to the same instance.
                        const destAp = airports[selectedDest];
                        if (destAp) {
                            const nearLon = destAp.lon + selectedDestOffset;
                            map.panTo([destAp.lat, nearLon], { animate: true, duration: 0.5 });
                        }
                        selectSource(selectedDest, selectedDestOffset);
                    } else {
                        deselect();
                    }
                });
            }

            document.getElementById('info').style.display = 'none';

            // Request routes from the local web server, or signal the Qt host.
            if (routeRequestUrl) {
                fetch(routeRequestUrl + '?source=' + encodeURIComponent(code))
                    .then(response => response.ok ? response.json() : [])
                    .then(loadRoutes)
                    .catch(() => loadRoutes([]));
            } else {
                console.log("REQUEST_ROUTES|" + code);
            }
        }

        function deselect() {
            selectedSource = null;
            selectedDest = null;
            currentRoutes = [];
            routeLayer.clearLayers();
            document.getElementById('info').style.display = 'none';

            if (deselectMarker) {
                map.removeLayer(deselectMarker);
                deselectMarker = null;
            }
            if (deselectDestMarker) {
                map.removeLayer(deselectDestMarker);
                deselectDestMarker = null;
            }

            // Restore all airports
            visibleFilter = null;
            Object.keys(airports).forEach(iata => showAirport(iata));
        }

        function deslectDestOnly() {
            selectedDest = null;
            document.getElementById('info').style.display = 'none';
            if (deselectDestMarker) {
                map.removeLayer(deselectDestMarker);
                deselectDestMarker = null;
            }
            renderMapState();
        }

        // --- DATA RECEIVER ---
        function loadRoutes(routes) {
            if (!routes) routes = [];
            currentRoutes = routes; // Store globally

            // Only render if we still have a source selected (user might have clicked away)
            if (selectedSource) {
                renderMapState();

                // Show only connected airports, hide the rest
                const connectedIatas = new Set();
                connectedIatas.add(selectedSource);
                routes.forEach(r => {
                    connectedIatas.add(r.dep);
                    connectedIatas.add(r.arr);
                });
                visibleFilter = connectedIatas;

                Object.keys(airports).forEach(iata => {
                    if (connectedIatas.has(iata)) {
                        showAirport(iata);
                    } else {
                        hideAirport(iata);
                    }
                });
            }
        }

        // --- VISUALIZATION ---

        // Compute great-circle points in canonical longitude space (near src.lon).
        // Returns an array of [lat, lon] with continuity already unwrapped.
        function computeGeodesicPoints(srcLat, srcLon, destLat, destLon) {
            // Ensure we take the short path across the antimeridian
            let dLon = destLon - srcLon;
            if (dLon > 180)       destLon -= 360;
            else if (dLon < -180) destLon += 360;

            const lat1 = srcLat  * Math.PI / 180;
            const lon1 = srcLon  * Math.PI / 180;
            const lat2 = destLat * Math.PI / 180;
            const lon2 = destLon * Math.PI / 180;

            const d = 2 * Math.asin(Math.sqrt(
                Math.pow(Math.sin((lat1 - lat2) / 2), 2) +
                Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin((lon1 - lon2) / 2), 2)
            ));

            // Handle very small distances (e.g. self-loops) to prevent NaN errors
            if (d < 1e-9) {
                return [[srcLat, srcLon], [destLat, destLon]];
            }

            const numPoints = 50;
            const raw = [];
            for (let i = 0; i <= numPoints; i++) {
                const f = i / numPoints;
                const A = Math.sin((1 - f) * d) / Math.sin(d);
                const B = Math.sin(f * d) / Math.sin(d);
                const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
                const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
                const z = A * Math.sin(lat1) + B * Math.sin(lat2);
                raw.push([
                    Math.atan2(z, Math.sqrt(x*x + y*y)) * 180 / Math.PI,
                    Math.atan2(y, x) * 180 / Math.PI
                ]);
            }

            // Unwrap longitude for Leaflet polyline continuity
            const pts = [raw[0].slice()];
            for (let i = 1; i < raw.length; i++) {
                const prev = pts[i - 1];
                const curr = raw[i].slice();
                let diff = curr[1] - prev[1];
                while (diff > 180)  { curr[1] -= 360; diff -= 360; }
                while (diff < -180) { curr[1] += 360; diff += 360; }
                pts.push(curr);
            }
            return pts;
        }

        // Draw a geodesic route anchored to the world copy the source airport was clicked on.
        // The geodesic is always computed in canonical space; the offset is then added
        // to every point's longitude, placing the whole arc on the correct world copy.
        function drawRouteAtCenter(src, dest, options, layer, offset) {
            const pts = computeGeodesicPoints(src.lat, src.lon, dest.lat, dest.lon);
            // Shift every point onto the correct world copy
            const shifted = pts.map(p => [p[0], p[1] + offset]);
            L.polyline(shifted, options).addTo(layer);
        }

        function renderMapState() {
            routeLayer.clearLayers();

            if (!currentRoutes || currentRoutes.length === 0) {
                return;
            }

            // CASE A: Source Selected, No Dest (Show All Connections)
            if (selectedSource && !selectedDest) {
                currentRoutes.forEach(r => {
                    const otherCode = (r.dep === selectedSource) ? r.arr : r.dep;
                    const otherAp = airports[otherCode];

                    if (otherAp) {
                        const srcAp = airports[selectedSource];
                        drawRouteAtCenter(srcAp, otherAp, {
                            color: LINE_COLOR,
                            weight: 1.5,
                            opacity: 0.6,
                            pane: 'routesPane'
                        }, routeLayer, selectedSourceOffset);
                    }
                });
            }

            // CASE B: Source AND Dest Selected (Show Pair Details)
            else if (selectedSource && selectedDest) {
                const destAp = airports[selectedDest];
                const destCity = destAp ? destAp.city : '';
                document.getElementById('title-loc').innerText = selectedSource + " ⇄ " + selectedDest + " (" + destCity + ")";

                // Filter routes
                const pairRoutes = currentRoutes.filter(r => r.dep === selectedDest || r.arr === selectedDest);

                // Draw ONE bold line
                const srcAp = airports[selectedSource];
                if (srcAp && destAp) {
                    drawRouteAtCenter(srcAp, destAp, {
                        color: LINE_COLOR,
                        weight: 2,
                        opacity: 1,
                        pane: 'routesPane'
                    }, routeLayer, selectedSourceOffset);
                }

                // Detailed List with Collapsible Cards
                let html = '<div><strong>' + pairRoutes.length + ' Flights</strong></div><br>';

                pairRoutes.forEach((r, idx) => {
                    const callsign = r.callsign || '-';
                    const reg = r.reg || '-';
                    const type = r.type || '-';
                    const type_icao = r.type_icao || '-';
                    const dep_icao = r.dep_icao || '-';
                    const arr_icao = r.arr_icao || '-';
                    const airline = r.airline || '-';
                    const date = r.date || '-';
                    const dep = r.dep;
                    const arr = r.arr;

                    const uniqueId = 'flight-detail-' + idx;

                    html += `
                    <div class="flight-card">
                        <div class="flight-header">
                            <span>${r.flight}</span>
                            <span style="opacity:0.7">${type_icao}</span>
                        </div>
                        <div class="flight-sub">
                            ${dep} (${dep_icao}) &rarr; ${arr} (${arr_icao})
                        </div>

                        <div id="${uniqueId}" style="display:none; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1);">
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; font-size:11px;">
                                <div class="detail-kv" style="grid-column: span 2"><span class="label">Airline</span><span>${airline}</span></div>
                                <div class="detail-kv"><span class="label">Callsign</span><span>${callsign}</span></div>
                                <div class="detail-kv"><span class="label">Registration</span><span>${reg}</span></div>
                                <div class="detail-kv"><span class="label">Aircraft</span><span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${type}</span></div>
                                <div class="detail-kv"><span class="label">Type Code</span><span>${type_icao}</span></div>
                                <div class="detail-kv"><span class="label">From</span><span>${dep} / ${dep_icao}</span></div>
                                <div class="detail-kv"><span class="label">To</span><span>${arr} / ${arr_icao}</span></div>
                                <div class="detail-kv" style="grid-column: span 2"><span class="label">Date Recorded</span><span>${date}</span></div>
                            </div>
                        </div>

                        <div class="expand-btn" onclick="let el = document.getElementById('${uniqueId}'); el.style.display = (el.style.display === 'none' ? 'block' : 'none'); this.innerText = (el.style.display === 'block' ? '▲ Less Info' : '▼ More Info');">
                            ▼ More Info
                        </div>
                    </div>`;
                });

                html += '<br><div style="text-align:center; font-size:11px; opacity:0.6; cursor:pointer;" onclick="deslectDestOnly()">Return to All Connections</div>';

                document.getElementById('panel-content').innerHTML = html;
            }
        }

    </script>
</body>
</html>
